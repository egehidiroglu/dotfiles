# ~/.tmux.conf — neon, vim-flavoured, persistent.
# Reload: prefix + r, or `tmux source-file ~/.tmux.conf` from a running session.

# ── Prefix: Ctrl-Space (free hand on the home row, no Ctrl-a conflict with shell) ──
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── General ───────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,*256col*:Tc"  # truecolor
set -g escape-time 10           # less laggy esc in nvim
set -g focus-events on
set -g history-limit 100000
set -g mouse on
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes too
set -g renumber-windows on
set -g set-titles on

# ── Vim-style pane navigation ─────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# Splits keep current pane's path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# ── Reload config ─────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ── Copy-mode: vi keys ────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# ── Status bar — evangelion-neon palette ──────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#050510 fg=#e0e0ff"
set -g status-left-length 40
set -g status-right-length 100

# Session block: eva-purple bg with black text
set -g status-left  "#[bg=#b026ff,fg=#050510,bold]  #S #[bg=#050510,fg=#b026ff]"
# Right side: cyan host, eva-green clock, magenta date
set -g status-right "#[fg=#00ffff]#(whoami)@#h #[fg=#6a6a8a]│ #[fg=#39ff14]%H:%M #[fg=#6a6a8a]│ #[fg=#ff00ff]%a %d %b "

# Window status
setw -g window-status-format          "#[fg=#6a6a8a] #I:#W "
setw -g window-status-current-format  "#[bg=#1a1a3a,fg=#39ff14,bold] #I:#W "

# Pane borders — magenta when active, dim when not
set -g pane-border-style        "fg=#1a1a3a"
set -g pane-active-border-style "fg=#ff00ff"

# Message styling — eva-green flash
set -g message-style "bg=#39ff14 fg=#050510 bold"

# ── Plugins via TPM (install: prefix + I) ─────────────────────────────────
# Bootstrapped by setup.sh. Plugins:
#  • tpm                   — plugin manager
#  • tmux-resurrect        — save/restore sessions across reboots (prefix + Ctrl-s / Ctrl-r)
#  • tmux-continuum        — auto-save resurrect every 15 min, restore on tmux start
#  • tmux-yank             — better copy-to-clipboard
#  • tmux-pain-control     — sane pane defaults (already partially mapped above)

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
