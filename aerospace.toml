# ~/.config/aerospace/aerospace.toml — i3-style tiling WM for macOS.
# https://github.com/nikitabobko/AeroSpace

# Start at login
start-at-login = true

after-startup-command = []
after-login-command   = []

# Tiling defaults
default-root-container-layout       = 'tiles'
default-root-container-orientation  = 'auto'

# Mouse-follows-focus is opinionated; disable if you find it twitchy
on-focus-changed = ['move-mouse window-lazy-center']
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Gaps between windows — Nokia-3310-Japan likes a bit of breathing room
[gaps]
inner.horizontal = 8
inner.vertical   = 8
outer.left       = 8
outer.bottom     = 8
outer.top        = 8
outer.right      = 8

# ── Main mode ─────────────────────────────────────────────────────────────
# Modifier: alt   (Option key on Mac). Mirrors i3/sway muscle memory.
[mode.main.binding]

# Focus
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Move window
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Resize
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# Layouts
alt-slash      = 'layout tiles horizontal vertical'    # toggle tiling orientation
alt-comma      = 'layout accordion horizontal vertical' # accordion (one-window-takes-most)
alt-shift-f    = 'fullscreen'

# Float / unfloat (good for QuickTime, calculators, etc.)
alt-shift-space = 'layout floating tiling'

# Workspaces — number row
alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

# Move window to workspace
alt-shift-1 = ['move-node-to-workspace 1', 'workspace 1']
alt-shift-2 = ['move-node-to-workspace 2', 'workspace 2']
alt-shift-3 = ['move-node-to-workspace 3', 'workspace 3']
alt-shift-4 = ['move-node-to-workspace 4', 'workspace 4']
alt-shift-5 = ['move-node-to-workspace 5', 'workspace 5']
alt-shift-6 = ['move-node-to-workspace 6', 'workspace 6']
alt-shift-7 = ['move-node-to-workspace 7', 'workspace 7']
alt-shift-8 = ['move-node-to-workspace 8', 'workspace 8']
alt-shift-9 = ['move-node-to-workspace 9', 'workspace 9']
alt-shift-0 = ['move-node-to-workspace 10', 'workspace 10']

# Quick toggle between recent workspaces
alt-tab = 'workspace-back-and-forth'

# Reload config
alt-shift-c = 'reload-config'

# Enter "service" sub-mode for less-common commands
alt-shift-semicolon = 'mode service'

# ── Service mode (rare commands) ──────────────────────────────────────────
[mode.service.binding]
esc           = ['reload-config', 'mode main']
r             = ['flatten-workspace-tree', 'mode main']      # reset layout
f             = ['layout floating tiling', 'mode main']      # toggle floating
backspace     = ['close-all-windows-but-current', 'mode main']
alt-shift-h   = ['join-with left',  'mode main']
alt-shift-j   = ['join-with down',  'mode main']
alt-shift-k   = ['join-with up',    'mode main']
alt-shift-l   = ['join-with right', 'mode main']

# ── Window rules ──────────────────────────────────────────────────────────
# Default: every new window floats (drag-resize works like normal macOS).
# Use `alt-shift-space` to toggle a window into tiling when you want it tiled.
# This rule has no `if` clause, so it matches every window.
[[on-window-detected]]
run = 'layout floating'
